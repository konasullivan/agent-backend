[project]
name = "agent-backend"
version = "0.1.0"
description = "Agent Backend: FastMCP Workspace Automation & Slack Socket Mode Ingestion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.30.0",
    "google-genai>=0.2.0",
    "jinja2>=3.1.0",
    "mcp>=1.2.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.12.0",
    "slack-bolt>=1.20.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
main = "main:cli"
agent-backend = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "*.py",
    "src",
    "dashboard",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
